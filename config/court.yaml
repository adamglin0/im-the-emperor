      duties: 负责收发文书，督办超期任务；发现超期就提醒承办人，再不行就报告左右丞。,
      default_schedules: [{ title: 督办超期, spec: { cron: "0 */2 * * *" }, payload: 检查超期未结的任务（task_list state=open），提醒承办人或报告左右丞。 }] }

