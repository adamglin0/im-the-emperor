# 由 scripts/gen-compose.mjs 根据 config/court.yaml 生成，请勿手改（改名册后重新生成）。
# 先运行 scripts/court.sh init 生成 .env（随机 token）；mock 演练：scripts/court.sh mock-up
name: im-the-emperor
services:
  hub:
    image: court-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    hostname: hub
    environment:
      ROLE: hub
      PORT: "8000"
      DATA_DIR: /data
      CONFIG_DIR: /config
      WEB_DIR: /app/web
      EMPEROR_PORT: "8001"
      HUB_DB_PATH: /data/hub-db/court.db
      GATEWAY_URL: http://gateway:8100
      LLM_MODE: ${LLM_MODE:-real}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?请先运行 scripts/court.sh init 生成 .env}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:?请先运行 scripts/court.sh init 补充 .env}
      CONTROL_TOKEN: ${CONTROL_TOKEN:?请先运行 scripts/court.sh init 生成 .env}
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?请先运行 scripts/court.sh init 生成 .env}
      MCP_TOKEN: ${MCP_TOKEN:?请先运行 scripts/court.sh init 补充 .env}
      MCP_URL: http://mcp:8300
    ports:
      - 127.0.0.1:8001:8001
    volumes:
      - ./data/hub:/data/hub
      - ${HUB_DB_STORE:-./data/hub-db}:/data/hub-db
      - ./data/shared:/data/shared
      - ./config:/config:ro
    networks:
      - court
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  gateway:
    image: court-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    hostname: gateway
    environment:
      ROLE: gateway
      PORT: "8100"
      DATA_DIR: /data
      CONFIG_DIR: /config
      HUB_URL: http://hub:8000
      LLM_MODE: ${LLM_MODE:-real}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?请先运行 scripts/court.sh init 生成 .env}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:?请先运行 scripts/court.sh init 补充 .env}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      GATEWAY_MAX_CONCURRENCY: ${GATEWAY_MAX_CONCURRENCY:-6}
      NODE_USE_ENV_PROXY: "1"
      NO_PROXY: hub,gateway,sandbox,localhost,127.0.0.1
    env_file:
      - path: .env.providers
        required: false
    volumes:
      - ./data/gateway:/data/gateway
      - ./data/shared:/data/shared:ro
      - ./config:/config:ro
      - ${PI_AUTH_FILE:-${HOME}/.pi/agent/auth.json}:/secrets/pi-auth.json:ro
    networks:
      - court
    depends_on: &a1
      hub:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  sandbox:
    image: court-sandbox:latest
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
    hostname: sandbox
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    environment:
      PORT: "8200"
      SANDBOX_ROOT: /workspaces
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?请先运行 scripts/court.sh init 生成 .env}
    volumes:
      - ${SANDBOX_WORKSPACES:-./data/sandbox}:/workspaces
    networks:
      - armory
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8200/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  mcp:
    image: court-mcp:latest
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    hostname: mcp
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    environment:
      PORT: "8300"
      HUB_URL: http://hub:8000
      MCP_TOKEN: ${MCP_TOKEN:?请先运行 scripts/court.sh init 补充 .env}
      MCP_STDIO_RUNNER: docker
      MCP_BLOCKED_HOSTS: hub,gateway,sandbox,mcp,localhost,127.0.0.1,::1,0.0.0.0,host.docker.internal,gateway.docker.internal,dept-zhengshitang,dept-zhongshu,dept-menxia,dept-shangshu,dept-libu,dept-hubu,dept-libu-rites,dept-bingbu,dept-xingbu,dept-gongbu,dept-yushitai
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - court
    depends_on: *a1
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8300/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
